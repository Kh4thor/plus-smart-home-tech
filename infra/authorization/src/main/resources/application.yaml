server:
  port: 423

spring:
  application:
    name: authorization

  datasource:
    url: jdbc:postgresql://localhost:5432/authorization
    username: user_author
    password: pass_author
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect